services:
  vllm:
    # Placeholder tag: confirm the current vLLM container tag for your DGX Spark
    # (arm64 / GB10) against NVIDIA NGC before deploying — this one is not verified.
    image: nvcr.io/nvidia/vllm:26.04-py3
    command: >
      vllm serve ${VLLM_MODEL}
      --host 0.0.0.0 --port 8000
      --max-model-len 32768 --gpu-memory-utilization 0.85 --max-num-seqs 4
      --enable-auto-tool-choice --tool-call-parser ${VLLM_TOOL_PARSER:-hermes}
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    volumes: ["${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface"]
    restart: always
  bot:
    build: .
    env_file: .env
    environment:
      OPENAI_BASE_URL: http://vllm:8000/v1
      KNOWLEDGE_DIR: /knowledge
      DATA_DIR: /data
    volumes: ["./knowledge:/knowledge", "./data:/data", "./models:/models:ro"]
    depends_on: [vllm]
    restart: always
